<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upanishad Explorer</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app-container">
      <nav id="nav-pane" class="navigator-pane">
        <!-- HEADER COMES FIRST -->
        <header class="pane-header">
          <h2>अनुक्रमणिका</h2>
          <button id="mobile-nav-close" class="close-button">&times;</button>
        </header>

        <!-- TEXT SELECTOR COMES AFTER THE HEADER -->
        <div id="text-selector-container">
          <select id="text-selector"></select>
        </div>

        <!-- NAVIGATOR CONTENT COMES LAST -->
        <div id="navigator-content" class="pane-content"></div>
      </nav>

      <main id="main-pane" class="main-content-pane">
        <header class="main-header">
          <button id="mobile-nav-toggle" class="menu-button">&#9776;</button>

          <!-- UPDATED IDs -->
          <button id="prev-section" class="nav-arrow prev-arrow">&lt;</button>
          <h1 id="content-title">Loading...</h1>
          <button id="next-section" class="nav-arrow next-arrow">&gt;</button>
        </header>
        <div id="mantra-display" class="pane-content"></div>
      </main>

      <aside id="commentary-pane" class="commentary-pane">
        <header class="pane-header">
          <h2>भाष्यम्</h2>
          <button id="mobile-commentary-close" class="close-button">
            &times;
          </button>
        </header>
        <div id="commentary-text" class="pane-content"></div>
      </aside>

      <div id="mobile-overlay" class="mobile-overlay"></div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
      defer
    ></script>
    <script src="https://unpkg.com/split.js/dist/split.min.js" defer></script>
    <!-- MODIFIED SCRIPT TAG -->
    <script src="js/app.js" type="module" defer></script>
  </body>
</html>
