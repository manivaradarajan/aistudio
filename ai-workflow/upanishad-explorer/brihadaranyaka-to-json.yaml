# File: process-brihadaranyaka.yaml

model: gemini-2.5-pro
run_name: brihadaranyaka-batch-process

workflow:
  - type: foreach

    # Define the set of files to loop over.
    in_fileset:
      base_dir: input-files/brihadaranyaka
      include:
        - bRhadAraNyakopaniSat-aSTama.md

    # Define the action to perform for each file found by the fileset.
    do:
      type: chat
      prompt: prompt-task.txt
      schema: texts_split_schema.json
      json: true

      # The dynamic output path for each processed file.
      # {basename} is a placeholder for the input filename without its extension.
      output: output/brihadaranyaka/brihadaranyaka-{basename}.json
