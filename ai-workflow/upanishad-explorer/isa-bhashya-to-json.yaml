# === Global Configuration ===
# These settings apply to the entire run unless overridden below.
model: gemini-2.5-pro
run_name: "isavasya-upanishad-commentary"

# === Dynamic Workflow Definition ===
workflow:
  - type: chat
    prompt: "prompt-task-isa.txt"
    output_extension: ".json"
    fileset:
      base_dir: "."
      include:
        - "input-files/isa.md"
        - "text_schema.json"
      global_search: true
